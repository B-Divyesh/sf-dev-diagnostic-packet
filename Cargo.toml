[package]
name = "diagnostic-packet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Create safe, inspectable reproduction packets for development incidents"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-dev-diagnostic-packet"
homepage = "https://dev-diagnostic-packet.sociobot.in"
readme = "README.md"
keywords = ["diagnostics", "bug-report", "redaction", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/examples/**"]

[[bin]]
name = "diagnostic-packet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
toml = "0.9.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.21.0"
